<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モグラ叩きゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            text-align: center;
            padding: 30px;
            background: rgba(30, 30, 45, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(100, 100, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #e0e0e0;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(150, 150, 255, 0.5);
        }

        .game-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .score {
            color: #4ade80;
        }

        .time {
            color: #f87171;
        }

        .difficulty-select {
            margin-bottom: 25px;
        }

        .difficulty-select h3 {
            color: #a0a0a0;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .difficulty-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .diff-btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #ccc;
            background: rgba(60, 60, 80, 0.8);
            border: 2px solid rgba(100, 100, 120, 0.5);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn:hover {
            background: rgba(80, 80, 100, 0.9);
            border-color: rgba(150, 150, 170, 0.7);
        }

        .diff-btn.selected {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.3);
            color: #fff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .diff-btn.easy.selected {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.2);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }

        .diff-btn.normal.selected {
            border-color: #facc15;
            background: rgba(250, 204, 21, 0.2);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }

        .diff-btn.hard.selected {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.2);
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.4);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .hole {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #2a2a3a, #1a1a28);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 10px rgba(0, 0, 0, 0.5);
            border: 3px solid #3a3a4a;
        }

        .hole::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(to top, #0f0f18, transparent);
            pointer-events: none;
        }

        .mole {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #7c5c4a, #5a4235);
            border-radius: 50% 50% 45% 45%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -100%;
            transition: bottom 0.15s ease-out;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .mole::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 15px;
            width: 12px;
            height: 12px;
            background: #1a1a1a;
            border-radius: 50%;
            box-shadow: 38px 0 0 #1a1a1a;
        }

        .mole::after {
            content: '';
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            background: #e57373;
            border-radius: 50%;
        }

        .mole.up {
            bottom: 15%;
        }

        .mole.whacked {
            background: linear-gradient(145deg, #ef5350, #c62828);
            animation: whack 0.2s ease-out;
        }

        @keyframes whack {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(0.8); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(25, 25, 40, 0.98);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(100, 100, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .game-over h2 {
            color: #f87171;
            margin-bottom: 15px;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.5);
        }

        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        .hidden {
            display: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99;
        }

        .difficulty-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>モグラ叩きゲーム</h1>

        <div class="game-info">
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="time">残り時間: <span id="time">30</span>秒</div>
        </div>

        <div class="difficulty-select" id="difficulty-select">
            <h3>難易度を選択</h3>
            <div class="difficulty-buttons">
                <button class="diff-btn easy" data-difficulty="easy">かんたん</button>
                <button class="diff-btn normal selected" data-difficulty="normal">ふつう</button>
                <button class="diff-btn hard" data-difficulty="hard">むずかしい</button>
            </div>
        </div>

        <div class="game-board" id="game-board">
            <div class="hole" data-id="0"><div class="mole"></div></div>
            <div class="hole" data-id="1"><div class="mole"></div></div>
            <div class="hole" data-id="2"><div class="mole"></div></div>
            <div class="hole" data-id="3"><div class="mole"></div></div>
            <div class="hole" data-id="4"><div class="mole"></div></div>
            <div class="hole" data-id="5"><div class="mole"></div></div>
            <div class="hole" data-id="6"><div class="mole"></div></div>
            <div class="hole" data-id="7"><div class="mole"></div></div>
            <div class="hole" data-id="8"><div class="mole"></div></div>
        </div>

        <button id="start-btn" class="start-btn">ゲームスタート</button>

        <div id="game-over" class="game-over hidden">
            <h2>ゲーム終了!</h2>
            <p>最終スコア: <span id="final-score">0</span></p>
            <p class="difficulty-label">難易度: <span id="final-difficulty"></span></p>
            <button id="restart-btn" class="start-btn">もう一度プレイ</button>
        </div>
    </div>

    <script>
        class WhackAMoleGame {
            constructor() {
                this.score = 0;
                this.timeLeft = 30;
                this.gameInterval = null;
                this.isPlaying = false;
                this.lastMoleIndex = -1;
                this.difficulty = 'normal';

                // 難易度設定: モグラの表示時間と出現間隔
                this.difficultySettings = {
                    easy: {
                        minUpTime: 1000,
                        maxUpTime: 1500,
                        minSpawnDelay: 400,
                        maxSpawnDelay: 600,
                        label: 'かんたん'
                    },
                    normal: {
                        minUpTime: 600,
                        maxUpTime: 1000,
                        minSpawnDelay: 200,
                        maxSpawnDelay: 400,
                        label: 'ふつう'
                    },
                    hard: {
                        minUpTime: 350,
                        maxUpTime: 600,
                        minSpawnDelay: 100,
                        maxSpawnDelay: 250,
                        label: 'むずかしい'
                    }
                };

                this.scoreDisplay = document.getElementById('score');
                this.timeDisplay = document.getElementById('time');
                this.startBtn = document.getElementById('start-btn');
                this.gameOverScreen = document.getElementById('game-over');
                this.finalScoreDisplay = document.getElementById('final-score');
                this.finalDifficultyDisplay = document.getElementById('final-difficulty');
                this.restartBtn = document.getElementById('restart-btn');
                this.difficultySelect = document.getElementById('difficulty-select');
                this.diffButtons = document.querySelectorAll('.diff-btn');
                this.holes = document.querySelectorAll('.hole');
                this.moles = document.querySelectorAll('.mole');

                this.init();
            }

            init() {
                this.startBtn.addEventListener('click', () => this.startGame());
                this.restartBtn.addEventListener('click', () => this.restartGame());

                this.diffButtons.forEach(btn => {
                    btn.addEventListener('click', () => this.selectDifficulty(btn));
                });

                this.moles.forEach((mole, index) => {
                    mole.addEventListener('click', (e) => this.whackMole(e, index));
                });

                this.holes.forEach((hole, index) => {
                    hole.addEventListener('click', (e) => {
                        if (e.target === hole) {
                            // Clicked on hole, not mole - miss!
                        }
                    });
                });
            }

            selectDifficulty(btn) {
                this.diffButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                this.difficulty = btn.dataset.difficulty;
            }

            startGame() {
                this.isPlaying = true;
                this.score = 0;
                this.timeLeft = 30;
                this.updateScore();
                this.updateTime();

                this.startBtn.classList.add('hidden');
                this.difficultySelect.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');

                this.removeOverlay();

                // Start the game timer
                this.gameInterval = setInterval(() => {
                    this.timeLeft--;
                    this.updateTime();

                    if (this.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);

                // Start spawning moles
                this.spawnMole();
            }

            spawnMole() {
                if (!this.isPlaying) return;

                const settings = this.difficultySettings[this.difficulty];

                // Hide all moles first
                this.moles.forEach(mole => mole.classList.remove('up'));

                // Pick a random hole (different from last one)
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * this.holes.length);
                } while (randomIndex === this.lastMoleIndex);

                this.lastMoleIndex = randomIndex;

                // Show the mole
                const mole = this.moles[randomIndex];
                mole.classList.add('up');
                mole.classList.remove('whacked');

                // Random time for mole to stay up based on difficulty
                const upTime = Math.random() * (settings.maxUpTime - settings.minUpTime) + settings.minUpTime;

                // Hide the mole after random time
                setTimeout(() => {
                    mole.classList.remove('up');

                    // Spawn next mole after a short delay based on difficulty
                    if (this.isPlaying) {
                        const nextSpawnDelay = Math.random() * (settings.maxSpawnDelay - settings.minSpawnDelay) + settings.minSpawnDelay;
                        setTimeout(() => this.spawnMole(), nextSpawnDelay);
                    }
                }, upTime);
            }

            whackMole(e, index) {
                e.stopPropagation();

                if (!this.isPlaying) return;

                const mole = this.moles[index];

                if (mole.classList.contains('up') && !mole.classList.contains('whacked')) {
                    mole.classList.add('whacked');
                    this.score += 10;
                    this.updateScore();

                    // Play hit effect
                    setTimeout(() => {
                        mole.classList.remove('up');
                        mole.classList.remove('whacked');
                    }, 150);
                }
            }

            updateScore() {
                this.scoreDisplay.textContent = this.score;
            }

            updateTime() {
                this.timeDisplay.textContent = this.timeLeft;

                // Change color when time is running low
                if (this.timeLeft <= 10) {
                    this.timeDisplay.parentElement.style.color = '#ef4444';
                } else {
                    this.timeDisplay.parentElement.style.color = '#f87171';
                }
            }

            endGame() {
                this.isPlaying = false;

                clearInterval(this.gameInterval);

                // Hide all moles
                this.moles.forEach(mole => {
                    mole.classList.remove('up');
                    mole.classList.remove('whacked');
                });

                // Show game over screen
                this.finalScoreDisplay.textContent = this.score;
                this.finalDifficultyDisplay.textContent = this.difficultySettings[this.difficulty].label;
                this.addOverlay();
                this.gameOverScreen.classList.remove('hidden');
            }

            restartGame() {
                this.gameOverScreen.classList.add('hidden');
                this.difficultySelect.classList.remove('hidden');
                this.startBtn.classList.remove('hidden');
                this.removeOverlay();
            }

            addOverlay() {
                if (!document.querySelector('.overlay')) {
                    const overlay = document.createElement('div');
                    overlay.className = 'overlay';
                    document.body.appendChild(overlay);
                }
            }

            removeOverlay() {
                const overlay = document.querySelector('.overlay');
                if (overlay) {
                    overlay.remove();
                }
            }
        }

        // Initialize the game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new WhackAMoleGame();
        });
    </script>
</body>
</html>
