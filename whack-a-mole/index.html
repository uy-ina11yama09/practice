<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モグラ叩きゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        .game-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .score {
            color: #2ecc71;
        }

        .time {
            color: #e74c3c;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .hole {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #8B4513, #654321);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.5);
            border: 4px solid #3d2817;
        }

        .hole::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(to top, #2d1810, transparent);
            pointer-events: none;
        }

        .mole {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #8B7355, #6B5344);
            border-radius: 50% 50% 45% 45%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -100%;
            transition: bottom 0.15s ease-out;
            cursor: pointer;
        }

        .mole::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 15px;
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            box-shadow: 38px 0 0 #333;
        }

        .mole::after {
            content: '';
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            background: #FF69B4;
            border-radius: 50%;
        }

        .mole.up {
            bottom: 15%;
        }

        .mole.whacked {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            animation: whack 0.2s ease-out;
        }

        @keyframes whack {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(0.8); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.5);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .game-over h2 {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
        }

        .hidden {
            display: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>モグラ叩きゲーム</h1>

        <div class="game-info">
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="time">残り時間: <span id="time">30</span>秒</div>
        </div>

        <div class="game-board" id="game-board">
            <div class="hole" data-id="0"><div class="mole"></div></div>
            <div class="hole" data-id="1"><div class="mole"></div></div>
            <div class="hole" data-id="2"><div class="mole"></div></div>
            <div class="hole" data-id="3"><div class="mole"></div></div>
            <div class="hole" data-id="4"><div class="mole"></div></div>
            <div class="hole" data-id="5"><div class="mole"></div></div>
            <div class="hole" data-id="6"><div class="mole"></div></div>
            <div class="hole" data-id="7"><div class="mole"></div></div>
            <div class="hole" data-id="8"><div class="mole"></div></div>
        </div>

        <button id="start-btn" class="start-btn">ゲームスタート</button>

        <div id="game-over" class="game-over hidden">
            <h2>ゲーム終了!</h2>
            <p>最終スコア: <span id="final-score">0</span></p>
            <button id="restart-btn" class="start-btn">もう一度プレイ</button>
        </div>
    </div>

    <script>
        class WhackAMoleGame {
            constructor() {
                this.score = 0;
                this.timeLeft = 30;
                this.gameInterval = null;
                this.moleInterval = null;
                this.isPlaying = false;
                this.lastMoleIndex = -1;

                this.scoreDisplay = document.getElementById('score');
                this.timeDisplay = document.getElementById('time');
                this.startBtn = document.getElementById('start-btn');
                this.gameOverScreen = document.getElementById('game-over');
                this.finalScoreDisplay = document.getElementById('final-score');
                this.restartBtn = document.getElementById('restart-btn');
                this.holes = document.querySelectorAll('.hole');
                this.moles = document.querySelectorAll('.mole');

                this.init();
            }

            init() {
                this.startBtn.addEventListener('click', () => this.startGame());
                this.restartBtn.addEventListener('click', () => this.restartGame());

                this.moles.forEach((mole, index) => {
                    mole.addEventListener('click', (e) => this.whackMole(e, index));
                });

                this.holes.forEach((hole, index) => {
                    hole.addEventListener('click', (e) => {
                        if (e.target === hole) {
                            // Clicked on hole, not mole - miss!
                        }
                    });
                });
            }

            startGame() {
                this.isPlaying = true;
                this.score = 0;
                this.timeLeft = 30;
                this.updateScore();
                this.updateTime();

                this.startBtn.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');

                this.removeOverlay();

                // Start the game timer
                this.gameInterval = setInterval(() => {
                    this.timeLeft--;
                    this.updateTime();

                    if (this.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);

                // Start spawning moles
                this.spawnMole();
            }

            spawnMole() {
                if (!this.isPlaying) return;

                // Hide all moles first
                this.moles.forEach(mole => mole.classList.remove('up'));

                // Pick a random hole (different from last one)
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * this.holes.length);
                } while (randomIndex === this.lastMoleIndex);

                this.lastMoleIndex = randomIndex;

                // Show the mole
                const mole = this.moles[randomIndex];
                mole.classList.add('up');
                mole.classList.remove('whacked');

                // Random time for mole to stay up (600ms - 1200ms)
                const upTime = Math.random() * 600 + 600;

                // Hide the mole after random time
                setTimeout(() => {
                    mole.classList.remove('up');

                    // Spawn next mole after a short delay
                    if (this.isPlaying) {
                        const nextSpawnDelay = Math.random() * 300 + 200;
                        setTimeout(() => this.spawnMole(), nextSpawnDelay);
                    }
                }, upTime);
            }

            whackMole(e, index) {
                e.stopPropagation();

                if (!this.isPlaying) return;

                const mole = this.moles[index];

                if (mole.classList.contains('up') && !mole.classList.contains('whacked')) {
                    mole.classList.add('whacked');
                    this.score += 10;
                    this.updateScore();

                    // Play hit effect
                    setTimeout(() => {
                        mole.classList.remove('up');
                        mole.classList.remove('whacked');
                    }, 150);
                }
            }

            updateScore() {
                this.scoreDisplay.textContent = this.score;
            }

            updateTime() {
                this.timeDisplay.textContent = this.timeLeft;

                // Change color when time is running low
                if (this.timeLeft <= 10) {
                    this.timeDisplay.parentElement.style.color = '#c0392b';
                } else {
                    this.timeDisplay.parentElement.style.color = '#e74c3c';
                }
            }

            endGame() {
                this.isPlaying = false;

                clearInterval(this.gameInterval);
                clearInterval(this.moleInterval);

                // Hide all moles
                this.moles.forEach(mole => {
                    mole.classList.remove('up');
                    mole.classList.remove('whacked');
                });

                // Show game over screen
                this.finalScoreDisplay.textContent = this.score;
                this.addOverlay();
                this.gameOverScreen.classList.remove('hidden');
            }

            restartGame() {
                this.gameOverScreen.classList.add('hidden');
                this.startGame();
            }

            addOverlay() {
                if (!document.querySelector('.overlay')) {
                    const overlay = document.createElement('div');
                    overlay.className = 'overlay';
                    document.body.appendChild(overlay);
                }
            }

            removeOverlay() {
                const overlay = document.querySelector('.overlay');
                if (overlay) {
                    overlay.remove();
                }
            }
        }

        // Initialize the game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new WhackAMoleGame();
        });
    </script>
</body>
</html>
